{% extends "base.html" %}
{% block title %}Archive — {{ site_name }}{% endblock %}
{% block content %}
<h1>Archive</h1>
{% if posts %}
  <ul class="archive">
  {% for post in posts %}
    <li>
      <span class="meta">{{ post.date|fmtdate }}</span>
      <a href="/posts/{{ post.slug }}">{{ post.title }}</a>
    </li>
  {% endfor %}
  </ul>
{% else %}
  <p>No posts yet.</p>
{% endif %}
{% endblock %}
