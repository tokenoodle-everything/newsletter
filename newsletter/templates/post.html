{% extends "base.html" %}
{% block title %}{{ post.title }} — {{ site_name }}{% endblock %}
{% block content %}
<article class="post">
  <header>
    <h1>{{ post.title }}</h1>
    <p class="meta">{{ post.date|fmtdate }}{% if post.author %} · {{ post.author }}{% endif %}</p>
  </header>
  <div class="post-body">
    {{ post.html | safe }}
  </div>
  <p><a href="/">&larr; Back to all posts</a></p>
</article>
{% endblock %}
