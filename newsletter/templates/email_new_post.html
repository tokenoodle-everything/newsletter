<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color:#222; line-height:1.55;">
    <h2 style="margin-bottom:4px;">{{ post.title }}</h2>
    {% if date_str %}<p style="color:#888; margin-top:0;">{{ date_str }}{% if post.author %} · {{ post.author }}{% endif %}</p>{% endif %}
    {% if post.summary %}
      <p style="font-size:16px;">{{ post.summary }}</p>
    {% endif %}
    <p><a href="{{ post_url }}" style="display:inline-block;padding:10px 16px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px;">Read the full post →</a></p>
    <hr style="border:none;border-top:1px solid #eee;margin:24px 0;">
    <p style="font-size:12px;color:#888;">
      You are receiving this because you subscribed to <strong>{{ site_name }}</strong>.<br>
      <a href="{{ unsubscribe_url }}">Unsubscribe</a>.
    </p>
  </body>
</html>
